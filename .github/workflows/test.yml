name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Convert the sample document
        run: |
          python persian-docx/scripts/fa_docx.py --file examples/sample.md \
            --kicker "سازمان نمونه" --date "۱۴۰۵/۰۵/۱۸"

      - name: Assert the OOXML obeys SKILL.md
        run: pytest tests/ -q
